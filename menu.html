<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu | FoodieFork</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation bar -->
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/></svg>
        FoodieFork
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="menu.html" class="active">Menu</a>
        <a href="checkout.html">Checkout</a>
      </nav>
      <a href="checkout.html" class="cart-btn">
        <svg class="cart-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
        Cart <span class="cart-badge">0</span>
      </a>
    </div>
  </header>

  <!-- Menu page header -->
  <section class="page-header">
    <div class="container">
      <h1>Our Menu</h1>
      <p>Search, filter and add your favourite food to the cart.</p>
    </div>
  </section>

  <!-- Search and filter tools -->
  <section class="menu-tools">
    <div class="container">
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search for burgers, pizza, salad...">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </div>

      <div class="filter-row" id="filter-row">
        <!-- Category buttons filled by JavaScript -->
      </div>

      <div class="results-info">
        <span id="results-count">16 items</span>
      </div>
    </div>
  </section>

  <!-- Menu items grid -->
  <section class="menu-section">
    <div class="container">
      <div class="food-grid" id="menu-grid">
        <!-- Food cards filled by JavaScript -->
      </div>
      <p class="no-results" id="no-results">No items found. Try a different search.</p>
    </div>
  </section>

  <!-- Customization modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal">
      <!-- Content filled by JavaScript when a dish is clicked -->
    </div>
  </div>

  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-inner">
      <p>&copy; 2026 FoodieFork. Made for a Web Technology project.</p>
      <p>Images from <a href="https://unsplash.com" target="_blank">Unsplash</a></p>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
